name: Sync fork with upstream

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: yappologistic/CUI
  UPSTREAM_BRANCH: master
  SYNC_BRANCHES: master
  SYNC_TAGS: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check write permission
        run: |
          echo "token can push: $(git push --dry-run origin HEAD:refs/heads/sync-perm-probe 2>&1 | head -3 | tr '\n' ' ')"
          echo "default workflow permissions:"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" || true

      - name: Sync code
        run: |
          set -uo pipefail
          URL="https://github.com/${UPSTREAM_REPO}.git"
          OUT=/tmp/notes.txt
          : > "$OUT"

          note() { printf '%s
' "- $1" >> "$OUT"; }

          SHA=$(git ls-remote --exit-code "$URL" "refs/heads/${UPSTREAM_BRANCH}" 2>/dev/null | cut -f1) || SHA=""
          if [ -z "$SHA" ]; then
            echo "::warning::upstream ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} not reachable, skip"
            exit 0
          fi
          echo "upstream HEAD: $SHA"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$URL"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*" > /dev/null 2>&1 || true
          git fetch --no-tags upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          FAILED=0
          for BR in ${SYNC_BRANCHES}; do
            echo "=== branch ${BR} ==="

            if ! git rev-parse --verify --quiet "refs/remotes/origin/${BR}" > /dev/null; then
              echo "::warning::branch ${BR} not found in fork"
              note "${BR}: Fork 中不存在，已跳过"
              continue
            fi

            git checkout -B "$BR" "refs/remotes/origin/${BR}" > /dev/null 2>&1
            git reset --hard "refs/remotes/origin/${BR}" > /dev/null 2>&1

            if ! git merge-base HEAD "refs/remotes/upstream/${UPSTREAM_BRANCH}" > /dev/null 2>&1; then
              echo "::error::${BR} shares no history with upstream"
              note "${BR}: 与上游无共同祖先，已中止"
              FAILED=1
              continue
            fi

            if git merge-base --is-ancestor "refs/remotes/upstream/${UPSTREAM_BRANCH}" HEAD; then
              echo "${BR} already up to date"
              note "${BR}: 已是最新"
              continue
            fi

            if ! git merge --no-edit "refs/remotes/upstream/${UPSTREAM_BRANCH}"; then
              git merge --abort > /dev/null 2>&1 || true
              echo "::error::${BR} merge conflict"
              note "${BR}: 合并冲突，需手动解决"
              FAILED=1
              continue
            fi

            if PUSH_ERR=$(git push origin "HEAD:${BR}" 2>&1); then
              echo "${BR} synced: $(git rev-parse --short HEAD)"
              note "${BR}: 同步到 $(git rev-parse --short HEAD)"
            else
              echo "::error::${BR} push failed"
              printf '%s
' "$PUSH_ERR"
              note "${BR}: 推送失败（见日志）"
              FAILED=1
            fi
          done

          if [ "${SYNC_TAGS}" = "true" ]; then
            echo "=== tags ==="
            if ! FETCH_ERR=$(git fetch --tags --force upstream "+refs/tags/*:refs/tags/*" 2>&1); then
              echo "::warning::fetch upstream tags failed"
              printf '%s
' "$FETCH_ERR"
              FAILED=1
            fi
            echo "local tags after fetch: $(git tag | wc -l)"

            git ls-remote --tags --refs "$URL" | awk '{print $2}' | sed 's#refs/tags/##' | sort > /tmp/up.txt
            git ls-remote --tags --refs origin | awk '{print $2}' | sed 's#refs/tags/##' | sort > /tmp/fork.txt
            echo "upstream tags: $(wc -l < /tmp/up.txt), fork tags: $(wc -l < /tmp/fork.txt)"

            for T in $(comm -23 /tmp/up.txt /tmp/fork.txt); do
              echo "pushing tag: ${T}"
              if TAG_ERR=$(git push origin "refs/tags/${T}:refs/tags/${T}" 2>&1); then
                echo "new tag: ${T}"
                note "tag: 新增 ${T}"
              else
                echo "::error::tag ${T} push failed"
                printf '%s
' "$TAG_ERR"
                note "tag: ${T} 推送失败（见日志）"
                FAILED=1
              fi
            done
          fi

          printf '%s
' "### 同步结果" "" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::部分内容未能自动同步，详见上方日志"
            exit 1
          fi
